server.port=8000
spring.application.name=pophie-server

# 业务运行时配置文件路径（对应原 Python config.yaml，支持 admin 热更新）
pophie.config-path=./config.yaml

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/pophie?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=3sLNOdveGXNKQz0SLsoXpwyy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (prod default: validate; dev profile overrides to update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 启动前补建新表（validate 模式，CREATE TABLE IF NOT EXISTS）
# 旧表重命名请手动执行：bash deploy/migrate-table-prefixes.sh
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# Redis (Spring Boot 3.x uses spring.data.redis.*)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=30000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Sa-Token（仅用于 /api/admin/** 管理后台鉴权）
sa-token.token-name=token
sa-token.timeout=2592000
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-style=uuid
sa-token.is-log=false
sa-token.is-read-cookie=false

# Jackson：snake_case 输出/输入，对齐原 Python (Pydantic) 的 JSON 契约；包含 null 字段（FastAPI model_dump 行为）
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# App crypto（AES 响应加密能力保留，默认不启用 @EncryptResponse）
# 生产部署生成真实密钥：openssl rand -base64 32
app.crypto.aes-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# 允许大请求体（音频 base64）
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=-1

# Logging
logging.file.path=./logs
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{0}: %msg%n

# Tomcat 线程池配置 - 提高并发处理能力
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=1000
server.tomcat.connection-timeout=30000

# HikariCP 数据库连接池优化
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PophieHikariPool

# MQTT 唤醒通知（机器人端订阅 wake topic，收到通知后通过 /api/reply/pull 短连接拉取消息）
# 留空则禁用MQTT，退化为WebSocket长连接兼容模式
mqtt.broker=tcp://localhost:1883
mqtt.username=
mqtt.password=
mqtt.client-id=pophie-server
