# Windows 本机部署：数据库/缓存/MQTT数据落到 ${DATA_ROOT}（默认 E 盘），不占 C 盘。
# 用法（在 server-java 目录）：
#   docker compose -f docker-compose.windows.yml up -d --build
# DATA_ROOT 由同目录 .env 提供（deploy\windows-deploy.ps1 会自动写入），例如 DATA_ROOT=E:/PophieData
services:
  app:
    build: .
    image: pophie-server:latest
    container_name: pophie-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_CRYPTO_AES_KEY: ${AES_KEY}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      POPHIE_CONFIG_PATH: /app/config.yaml
      LLM_API_KEY: ${LLM_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MQTT_BROKER: tcp://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "8000:8000"
      - "1883:1883"
      - "18083:18083"
    volumes:
      - ${DATA_ROOT}/logs:/app/logs
      - ${DATA_ROOT}/config.yaml:/app/config.yaml
    networks:
      - pophie-net

  mysql:
    image: mysql:8.0
    container_name: pophie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_ROOT}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pophie-net

  redis:
    image: redis:7-alpine
    container_name: pophie-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ${DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pophie-net

  mqtt:
    image: emqx/emqx:5.8
    container_name: pophie-mqtt
    restart: unless-stopped
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${MQTT_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${MQTT_DASHBOARD_PASSWORD:-public}
    volumes:
      - ${DATA_ROOT}/mqtt-data:/opt/emqx/data
      - ${DATA_ROOT}/mqtt-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - pophie-net

networks:
  pophie-net: {}
