# Pophie 管理后台（vben-admin）独立编排
# 与 server-java 的 docker-compose.yml 完全解耦：
#   - 不重建 app，只起 nginx 托管前端静态文件
#   - 通过外部网络 ibotserver-java_pophie-net 访问已运行的 pophie-app:8000
# 因此不影响现有 Java/Python 部署，可独立 up/down。
#
# 用法：
#   cd /opt/pophie-admin
#   docker compose -f docker-compose.admin.yml up -d
#   docker compose -f docker-compose.admin.yml logs -f
#   docker compose -f docker-compose.admin.yml down      # 仅停前端，不影响后端

services:
  admin-nginx:
    image: nginx:1.27-alpine
    container_name: pophie-admin-nginx
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-9901}:80"
    volumes:
      # 前端构建产物（apps/web-antd/dist）
      - ./html:/usr/share/nginx/html:ro
      # nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pophie-net
    healthcheck:
      # 用 127.0.0.1（alpine 的 localhost 解析到 IPv6 ::1，nginx 仅监听 IPv4 会拒连）
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/favicon.ico"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pophie-net:
    # 复用 Java 版 compose 已创建的桥接网络，容器名 pophie-app 可直接解析
    external: true
    name: ibotserver-java_pophie-net
