# Pophie 管理后台（vben-admin）Nginx 配置
# 前端静态文件 + 反向代理后端 Spring Boot（容器名 pophie-app:8000，走外部网络 pophie-net）

server {
    listen       80;
    server_name  _;

    # 前端静态资源
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 运行时配置文件不缓存（修改 API 地址无需重新构建）
    location ~* ^/_app-config-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # 反向代理后端 API（保留 /api 前缀）
    # pophie-app 是 Java 版 compose 里的容器名，走外部网络 ibotserver-java_pophie-net
    location /api/ {
        proxy_pass http://pophie-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / 流式接口（如 STT/TTS）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;   # SSE / chunked 流式响应不缓冲
    }

    # vben 用 hash 路由，所有静态资源路径稳定，无需 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的 js/css）
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
